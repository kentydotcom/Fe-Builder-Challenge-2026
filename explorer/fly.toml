# fe-fl-kent-private — Checkable Coordinator Judge Tour explorer (ungated, static nginx)
# Do not change [[vm]] size (shared-cpu-1x / 512mb).
app = 'fe-fl-kent-private'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1
