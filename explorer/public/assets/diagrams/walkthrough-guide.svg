<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 100" role="img" aria-label="A guided read of the Fe source, from types to the full tour test.">

  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="45%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#8a7248"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7248" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c4a574"/>
    </marker>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#e0c894"/>
    </marker>
  </defs>

  <rect x="16" y="16" width="828" height="68" rx="12" fill="#1a1512" stroke="#3d3229" stroke-width="1.5"/>
  <text x="48" y="56" font-family="Cormorant Garamond, Georgia, serif" font-size="20" fill="#f3ebe0" font-weight="600">Walkthrough</text>
  <path d="M160 50 H190" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="260" y="56" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Fe types</text>
  <path d="M320 50 H350" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="420" y="56" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">A round, in order</text>
  <path d="M520 50 H550" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="640" y="56" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Tests and the Anvil tour</text>
</svg>
