<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 168" role="img" aria-label="Each client files a hash receipt. The update stays off-chain.">

  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="45%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#8a7248"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7248" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c4a574"/>
    </marker>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#e0c894"/>
    </marker>
  </defs>

  <text x="78" y="20" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">Off-chain</text>
  <rect x="18.0" y="33.0" width="36" height="26" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="36" y="51" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">A</text>
  <rect x="18.0" y="67.0" width="36" height="26" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="36" y="85" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">B</text>
  <rect x="18.0" y="101.0" width="36" height="26" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="36" y="119" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">C</text>
  <rect x="18.0" y="135.0" width="36" height="26" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="36" y="153" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">D</text>
  <rect x="62" y="38" width="14" height="14" rx="2.5" fill="#2a221c" stroke="#8a7248" stroke-width="1.2"/>
  <rect x="62" y="72" width="14" height="14" rx="2.5" fill="#2a221c" stroke="#8a7248" stroke-width="1.2"/>
  <rect x="62" y="106" width="14" height="14" rx="2.5" fill="#2a221c" stroke="#8a7248" stroke-width="1.2"/>
  <rect x="62" y="140" width="14" height="14" rx="2.5" fill="#2a221c" stroke="#8a7248" stroke-width="1.2"/>
  <path d="M86 46 H128" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr-bright)"/>
  <path d="M86 80 H128" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr-bright)"/>
  <path d="M86 114 H128" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr-bright)"/>
  <path d="M86 148 H128" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr-bright)"/>
  <text x="240" y="20" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">On-chain</text>
  <rect x="134" y="30" width="210" height="126" rx="12" fill="#1a1512" stroke="url(#brass)" stroke-width="1.7"/>
  <rect x="148" y="44" width="88" height="40" rx="6" fill="#221c18" stroke="#c4a574" stroke-width="1.4"/>
  <path d="M158 58 H222 M158 70 H200" stroke="#e0c894" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="148" y="92" width="88" height="40" rx="6" fill="#221c18" stroke="#c4a574" stroke-width="1.4"/>
  <path d="M158 106 H222 M158 118 H200" stroke="#e0c894" stroke-width="1.3" stroke-linecap="round"/>
  <rect x="248" y="58" width="82" height="60" rx="6" fill="#2a221c" stroke="#e0c894" stroke-width="1.4"/>
  <circle cx="268" cy="88" r="9" fill="none" stroke="#c4a574" stroke-width="1.3"/>
  <text x="292" y="84" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#f3ebe0">Stake</text>
  <text x="292" y="100" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888">+ receipt</text>
  <text x="192" y="146" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">Hash receipt</text>
</svg>
