<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" role="img" aria-label="A peer posts a bond and accuses an update. Others vote. If the score is far from the median and the vote holds, the outlier is slashed and the average is revised. A false accusation slashes the accuser instead.">

  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="45%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#8a7248"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7248" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c4a574"/>
    </marker>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#e0c894"/>
    </marker>
  </defs>

  <!-- flow of 5 compact stages -->
  <rect x="10" y="36" width="150" height="120" rx="12" fill="#1a1512" stroke="url(#brass)" stroke-width="1.5"/>
  <circle cx="36" cy="60" r="12" fill="#120e0c" stroke="#c4a574" stroke-width="1.3"/>
  <text x="36" y="65" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">1</text>
  <text x="100" y="66" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Accuse</text>
  <circle cx="85" cy="112" r="20" fill="#221c18" stroke="#c4a574" stroke-width="1.4"/>
  <text x="85" y="116" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle">Bond</text>
  <text x="85" y="148" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">A names D</text>

  <path d="M160 96 H186" stroke="#c4a574" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="190" y="36" width="150" height="120" rx="12" fill="#1a1512" stroke="url(#brass)" stroke-width="1.5"/>
  <circle cx="216" cy="60" r="12" fill="#120e0c" stroke="#c4a574" stroke-width="1.3"/>
  <text x="216" y="65" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">2</text>
  <text x="280" y="66" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Vote</text>
  <text x="265" y="112" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">B stakes a vote</text>
  <text x="265" y="148" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">Vote bonds return</text>

  <path d="M340 96 H366" stroke="#c4a574" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="370" y="36" width="200" height="120" rx="12" fill="#1a1512" stroke="url(#brass)" stroke-width="1.5"/>
  <circle cx="396" cy="60" r="12" fill="#120e0c" stroke="#c4a574" stroke-width="1.3"/>
  <text x="396" y="65" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">3</text>
  <text x="480" y="66" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Resolve</text>
  <text x="470" y="104" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">Far from the median</text>
  <text x="470" y="124" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">and the vote holds?</text>
  <text x="470" y="148" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">then slash D</text>

  <path d="M570 96 H596" stroke="#c4a574" stroke-width="1.6" marker-end="url(#arr-bright)"/>

  <rect x="600" y="20" width="248" height="86" rx="12" fill="#2a221c" stroke="#e0c894" stroke-width="1.6"/>
  <text x="724" y="50" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Upheld — slash D, pay A</text>
  <text x="724" y="74" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">Then revise the average without D</text>

  <rect x="600" y="118" width="248" height="50" rx="10" fill="#1a1512" stroke="#5c4a38" stroke-width="1.4"/>
  <text x="724" y="148" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#a89888" text-anchor="middle">False charge — accuser loses the bond</text>

  <rect x="600" y="176" width="248" height="40" rx="10" fill="#1a1512" stroke="#3d3229" stroke-width="1.3"/>
  <text x="724" y="201" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">No votes — bond comes back, no slash</text>
</svg>
