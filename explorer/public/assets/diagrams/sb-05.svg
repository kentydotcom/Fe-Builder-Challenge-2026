<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 168" role="img" aria-label="Anyone checks the average against those receipts. No special key.">

  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="45%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#8a7248"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7248" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c4a574"/>
    </marker>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#e0c894"/>
    </marker>
  </defs>

  <!-- anyone figure -->
  <circle cx="48" cy="64" r="12" stroke="url(#brass)" stroke-width="1.6"/>
  <path d="M30 110 C30 86 38 78 48 78 C58 78 66 86 66 110" stroke="url(#brass)" stroke-width="1.6" stroke-linecap="round"/>
  <text x="48" y="128" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">Anyone</text>
  <path d="M70 80 H108" stroke="#c4a574" stroke-width="1.6" marker-end="url(#arr-bright)"/>
  <!-- receipts being checked -->
  <rect x="114" y="28" width="122" height="120" rx="12" fill="#1a1512" stroke="url(#brass)" stroke-width="1.7"/>
  <text x="175" y="50" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">Receipts</text>
  <g>
    <rect x="128" y="60" width="70" height="20" rx="4" fill="#221c18" stroke="#c4a574" stroke-width="1.2"/>
    <path d="M204 64 L210 70 L222 56" stroke="#e0c894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="88" width="70" height="20" rx="4" fill="#221c18" stroke="#c4a574" stroke-width="1.2"/>
    <path d="M204 92 L210 98 L222 84" stroke="#e0c894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="128" y="116" width="70" height="20" rx="4" fill="#221c18" stroke="#c4a574" stroke-width="1.2"/>
    <path d="M204 120 L210 126 L222 112" stroke="#e0c894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="M236 88 H268" stroke="#c4a574" stroke-width="1.6" marker-end="url(#arr-bright)"/>
  <rect x="272" y="64" width="76" height="48" rx="8" fill="#2a221c" stroke="url(#brass)" stroke-width="1.7"/>
  <text x="310" y="86" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Average</text>
  <path d="M296 100 L306 108 L326 92" stroke="#e0c894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- no special key -->
  <g transform="translate(300 20)">
    <path d="M8 14 A8 8 0 1 1 16 18 L16 22 H22 V26 H10 V18 A8 8 0 0 1 8 14Z" stroke="#8a7248" stroke-width="1.3"/>
    <path d="M2 6 L26 30" stroke="#e0c894" stroke-width="1.7" stroke-linecap="round"/>
  </g>
  <text x="310" y="154" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">No special key</text>
</svg>
