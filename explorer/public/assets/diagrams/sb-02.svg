      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="45%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#8a7248"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7248" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c4a574"/>
    </marker>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#e0c894"/>
    </marker>
  </defs>

  <rect x="26.0" y="16.0" width="40" height="28" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="46" y="35" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">A</text>
  <rect x="26.0" y="50.0" width="40" height="28" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="46" y="69" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">B</text>
  <rect x="26.0" y="84.0" width="40" height="28" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="46" y="103" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">C</text>
  <rect x="26.0" y="118.0" width="40" height="28" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="46" y="137" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">D</text>
  <path d="M68 30 H100" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M68 64 H100" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M68 98 H100" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M68 132 H100" stroke="#c4a574" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="108" y="16" width="130" height="136" rx="12" fill="#1a1512" stroke="#5c4a38" stroke-width="1.8"/>
  <rect x="108" y="16" width="130" height="136" rx="12" fill="url(#hatch)"/>
  <text x="173" y="76" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">Middleman</text>
  <text x="173" y="96" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500" letter-spacing="1.6">TRUST ME</text>
  <path d="M238 84 H268" stroke="#c4a574" stroke-width="1.6" marker-end="url(#arr)"/>
  <rect x="270" y="62" width="78" height="44" rx="8" fill="#221c18" stroke="#5c4a38" stroke-width="1.6"/>
  <text x="309" y="82" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Average</text>
  <text x="309" y="100" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#e0c894" text-anchor="middle" font-weight="600">?</text>
