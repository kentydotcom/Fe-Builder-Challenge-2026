<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 200" role="img" aria-label="A round in three steps: receipts, a checkable average, then a poison vote and revise.">

  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="45%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#8a7248"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7248" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c4a574"/>
    </marker>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#e0c894"/>
    </marker>
  </defs>

  <!-- step 1 -->
  <rect x="8" y="24" width="248" height="152" rx="14" fill="#1a1512" stroke="url(#brass)" stroke-width="1.6"/>
  <circle cx="36" cy="52" r="14" fill="#120e0c" stroke="#c4a574" stroke-width="1.4"/>
  <text x="36" y="57" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">1</text>
  <text x="132" y="58" font-family="Cormorant Garamond, Georgia, serif" font-size="20" fill="#f3ebe0" font-weight="600">Receipts</text>
  
  <rect x="40.0" y="102.0" width="40" height="32" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="60" y="123" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">A</text>
  
  <rect x="94.0" y="102.0" width="40" height="32" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="114" y="123" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">B</text>
  <rect x="150" y="100" width="86" height="48" rx="7" fill="#221c18" stroke="#c4a574" stroke-width="1.4"/>
  <path d="M162 116 H222 M162 128 H200" stroke="#e0c894" stroke-width="1.3" stroke-linecap="round"/>
  <text x="132" y="164" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">Hash receipt filed</text>
  <!-- arrow -->
  <path d="M266 100 H298" stroke="#c4a574" stroke-width="1.8" marker-end="url(#arr-bright)"/>
  <!-- step 2 -->
  <rect x="306" y="24" width="248" height="152" rx="14" fill="#1a1512" stroke="url(#brass)" stroke-width="1.6"/>
  <circle cx="334" cy="52" r="14" fill="#120e0c" stroke="#c4a574" stroke-width="1.4"/>
  <text x="334" y="57" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">2</text>
  <text x="430" y="58" font-family="Cormorant Garamond, Georgia, serif" font-size="20" fill="#f3ebe0" font-weight="600">FedAvg attest</text>
  <rect x="338" y="86" width="184" height="56" rx="8" fill="#221c18" stroke="#c4a574" stroke-width="1.4"/>
  <text x="430" y="112" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Average anyone can check</text>
  <path d="M400 126 L416 136 L454 108" stroke="#e0c894" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="430" y="164" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">No aggregator key</text>
  <path d="M564 100 H596" stroke="#c4a574" stroke-width="1.8" marker-end="url(#arr-bright)"/>
  <!-- step 3 -->
  <rect x="604" y="24" width="248" height="152" rx="14" fill="#1a1512" stroke="url(#brass)" stroke-width="1.6"/>
  <circle cx="632" cy="52" r="14" fill="#120e0c" stroke="#c4a574" stroke-width="1.4"/>
  <text x="632" y="57" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">3</text>
  <text x="744" y="58" font-family="Cormorant Garamond, Georgia, serif" font-size="20" fill="#f3ebe0" font-weight="600">Poison / revise</text>
  <circle cx="684" cy="114" r="18" fill="#221c18" stroke="#c4a574" stroke-width="1.4"/>
  <text x="684" y="119" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#e0c894" text-anchor="middle">Bond</text>
  <rect x="718" y="96" width="40" height="36" rx="6" fill="#1a1512" stroke="#5c4a38" stroke-width="1.3"/>
  <text x="738" y="118" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">D</text>
  <path d="M724 102 L752 126" stroke="#e0c894" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M770 114 H800" stroke="#c4a574" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="728" y="164" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">Slash, then revise</text>
</svg>
