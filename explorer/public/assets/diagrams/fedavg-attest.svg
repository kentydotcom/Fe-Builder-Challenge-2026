<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" role="img" aria-label="Anyone submits the vectors. The contract recomputes each hash and L1 score. A mismatch reverts. On a match it stores the sum, average, and participant commitments. No trusted aggregator key.">

  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e8d5a8"/>
      <stop offset="45%" stop-color="#c4a574"/>
      <stop offset="100%" stop-color="#8a7248"/>
    </linearGradient>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#8a7248" stroke-width="1.1" stroke-opacity="0.55"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#c4a574"/>
    </marker>
    <marker id="arr-bright" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#e0c894"/>
    </marker>
  </defs>

  <text x="110" y="28" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">Anyone submits vectors</text>
  <rect x="16" y="40" width="188" height="180" rx="14" fill="#1a1512" stroke="#3d3229" stroke-width="1.5"/>
  <text x="110" y="70" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">Calldata, not storage</text>
  
  <rect x="48.0" y="94.0" width="44" height="32" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="70" y="115" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">A</text>
  
  <rect x="108.0" y="94.0" width="44" height="32" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="130" y="115" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">B</text>
  
  <rect x="48.0" y="144.0" width="44" height="32" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="70" y="165" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">C</text>
  
  <rect x="108.0" y="144.0" width="44" height="32" rx="8" fill="#221c18" stroke="url(#brass)" stroke-width="1.6"/>
  <text x="130" y="165" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#f3ebe0" text-anchor="middle" font-weight="500">D</text>
  <path d="M204 130 H244" stroke="#c4a574" stroke-width="1.7" marker-end="url(#arr-bright)"/>

  <rect x="252" y="40" width="280" height="180" rx="14" fill="#1a1512" stroke="url(#brass)" stroke-width="1.7"/>
  <text x="392" y="70" font-family="Cormorant Garamond, Georgia, serif" font-size="20" fill="#f3ebe0" font-weight="600" text-anchor="middle">Contract checks</text>
  <rect x="272" y="88" width="240" height="44" rx="8" fill="#221c18" stroke="#c4a574" stroke-width="1.4"/>
  <text x="392" y="116" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">Recompute hash and L1</text>
  <!-- branch -->
  <path d="M392 132 V148" stroke="#c4a574" stroke-width="1.4"/>
  <path d="M392 148 H320" stroke="#8a7248" stroke-width="1.4" marker-end="url(#arr)"/>
  <path d="M392 148 H464" stroke="#c4a574" stroke-width="1.4" marker-end="url(#arr-bright)"/>
  <rect x="268" y="158" width="104" height="44" rx="8" fill="#120e0c" stroke="#5c4a38" stroke-width="1.4"/>
  <text x="320" y="185" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#a89888" text-anchor="middle">Mismatch → revert</text>
  <rect x="412" y="158" width="104" height="44" rx="8" fill="#2a221c" stroke="#e0c894" stroke-width="1.4"/>
  <text x="464" y="185" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">Match</text>

  <path d="M532 130 H572" stroke="#c4a574" stroke-width="1.7" marker-end="url(#arr-bright)"/>
  <rect x="580" y="40" width="264" height="180" rx="14" fill="#1a1512" stroke="url(#brass)" stroke-width="1.7"/>
  <text x="712" y="70" font-family="Cormorant Garamond, Georgia, serif" font-size="20" fill="#f3ebe0" font-weight="600" text-anchor="middle">Stored commitments</text>
  <text x="712" y="106" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="13" fill="#f3ebe0" text-anchor="middle">sum · average · participants</text>
  <text x="712" y="130" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#a89888" text-anchor="middle">plus the median score</text>
  <rect x="620" y="150" width="184" height="48" rx="8" fill="#2a221c" stroke="#c4a574" stroke-width="1.4"/>
  <text x="712" y="180" font-family="DM Sans, ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#e0c894" text-anchor="middle" font-weight="500">No trusted aggregator key</text>
</svg>
